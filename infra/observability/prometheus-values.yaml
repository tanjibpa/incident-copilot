# prometheus-community/prometheus: metrics backend.
# Receives OTLP metrics from the demo collector and scrapes cluster state
# (kube-state-metrics, node-exporter, kubelet/cAdvisor) so the agent can see
# restarts, OOMKills and resource pressure caused by chaos scenarios.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true

server:
  fullnameOverride: prometheus
  extraFlags:
    - web.enable-lifecycle
    - web.enable-otlp-receiver
    - enable-feature=exemplar-storage
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  retention: 7d
  tsdb:
    # OTLP pushes can arrive slightly out of order.
    out_of_order_time_window: 30m
  otlp:
    keep_identifying_resource_attributes: true
    # Promote resource attributes to labels so PromQL can filter by service and pod.
    promote_resource_attributes:
      - service.name
      - service.namespace
      - service.version
      - service.instance.id
      - deployment.environment.name
      - k8s.namespace.name
      - k8s.deployment.name
      - k8s.pod.name
      - k8s.node.name
      - k8s.container.name
  persistentVolume:
    enabled: false
  service:
    servicePort: 9090
  resources:
    limits:
      memory: 1Gi
